name: Deploy Calculator

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        continue-on-error: true
        with:
          context: .
          push: true
          tags: stellabenardo/vuna-calc:latest

      - name: Deploy via SSH with sudo
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          tar czf - index.html assets/ | sshpass -p '!eeu@Iu3E0' ssh -o StrictHostKeyChecking=no \
            beno@159.198.47.177 "cat > /tmp/web.tar.gz && echo '!eeu@Iu3E0' | sudo -S tar xzf /tmp/web.tar.gz -C /home/beno.vudse26.cloud/public_html/ && rm /tmp/web.tar.gz"
