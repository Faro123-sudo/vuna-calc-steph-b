<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BENO - SEN 482</title>
  <link rel="stylesheet" href="assets/css/bootstrap.min.css" />
  <style>
    body {
      background: linear-gradient(135deg, #eaf3ff, #cfe6ff);
      color: #0b2a4a;
      min-height: 100vh;
      display: flex;
      align-items: center;
    }

    .card {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(13, 110, 253, 0.15);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
      padding: 2.5rem;
    }

    h1 {
      color: #0d6efd;
      font-size: 1.8rem;
      margin-bottom: 1.5rem;
    }

    .info {
      font-size: 1rem;
      margin: 8px 0;
    }

    .info span {
      color: #386d9a;
    }

    .btn-calc {
      background: #0d6efd;
      color: white;
      border: none;
      padding: 12px 40px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1.1rem;
      margin-top: 1.5rem;
      display: inline-block;
      text-decoration: none;
      transition: all 0.3s;
      box-shadow: 0 10px 18px rgba(13, 110, 253, 0.25);
    }

    .btn-calc:hover {
      background: #0b5ed7;
      transform: translateY(-2px);
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-5 col-md-7">
        <div class="card">
          <h1>SEN 482</h1>
          <p class="info"><span>Name:</span> Limaro Stephanie Beno</p>
          <p class="info"><span>Matric:</span> VUG/SEN/22/7328</p>
          <p class="info"><span>Course:</span> SEN 482</p>
          <a href="calculator/" class="btn-calc">Open Calculator</a>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
