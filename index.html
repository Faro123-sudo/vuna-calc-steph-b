<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BENO - SEN 482</title>
  <link rel="stylesheet" href="assets/css/bootstrap.min.css" />
  <style>
    body {
      background: linear-gradient(135deg, #0d1b2a, #1b2838);
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
    }
    .card {
      background: #1e2a3a;
      border: 1px solid #2a3a4a;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      text-align: center;
      padding: 2.5rem;
    }
    h1 { color: #00d4aa; font-size: 1.8rem; margin-bottom: 1.5rem; }
    .info { font-size: 1rem; margin: 8px 0; }
    .info span { color: #8899aa; }
    .btn-calc {
      background: #00d4aa; color: #0d1b2a; border: none;
      padding: 12px 40px; border-radius: 8px; font-weight: 600;
      font-size: 1.1rem; margin-top: 1.5rem; display: inline-block;
      text-decoration: none; transition: all 0.3s;
    }
    .btn-calc:hover { background: #00b894; transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-5 col-md-7">
        <div class="card">
          <h1>SEN 482</h1>
          <p class="info"><span>Name:</span> Limaro Stephanie Beno</p>
          <p class="info"><span>Matric:</span> VUG/SEN/22/7328</p>
          <p class="info"><span>Course:</span> SEN 482</p>
          <a href="calculator/" class="btn-calc">Open Calculator</a>

      </div>
    </div>
